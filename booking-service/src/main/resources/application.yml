server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: booking-service
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/bookingdb
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:9092
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: booking-service
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.namnd.kafka.events.envelope.EventEnvelope
        spring.json.trusted.packages: com.namnd.kafka.events.*
    template:
      observation-enabled: true
    listener:
      observation-enabled: true

jwt:
  auth:
    secret: ${JWT_SECRET:kBJb8FEOvTCWEcfZB6RLMM5BLoI8p0FWOWEu7FSZBYn+ItVi7mHRePYCvum5Ic6l4M2nFw+kdl8du99Bxnb7zg==}
    # Phase 05 cutover: RS256 verification via JWKS; HS512 still accepted during grace.
    jwks-uri: ${JWT_JWKS_URI:http://auth-service:8081/oauth2/jwks}
    issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081}
    audience: ${JWT_AUDIENCE:ms-cinema-internal}
    dual-mode-enabled: ${JWT_DUAL_MODE_ENABLED:true}
    public-paths:
      - /actuator/health
      - /actuator/prometheus
      - /swagger-ui/**
      - /v3/api-docs/**
      - /swagger-ui.html
      - /api/bookings/showtimes/*/booked-seats
      - /ws/**

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}  # Use 0.1 or lower in production
  otlp:
    tracing:
      endpoint: http://${OTEL_COLLECTOR_HOST:localhost}:4318/v1/traces
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      deployment.environment: ${DEPLOYMENT_ENV:dev}
