apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: ms-cinema
  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/part-of: ms-cinema
    app.kubernetes.io/component: infrastructure
data:
  tempo.yaml: |
    server:
      http_listen_port: 3200
      grpc_listen_port: 3201
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
        wal:
          path: /var/tempo/wal
    compactor:
      compaction:
        block_retention: 24h
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tempo-traces
  namespace: ms-cinema
  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/part-of: ms-cinema
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tempo
  namespace: ms-cinema
  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/part-of: ms-cinema
    app.kubernetes.io/component: infrastructure
spec:
  serviceName: tempo
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tempo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tempo
        app.kubernetes.io/part-of: ms-cinema
    spec:
      containers:
        - name: tempo
          image: grafana/tempo:2.6.0
          args: ["-config.file=/etc/tempo/tempo.yaml"]
          ports:
            - { name: http, containerPort: 3200 }
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
          volumeMounts:
            - { name: config, mountPath: /etc/tempo }
            - { name: traces, mountPath: /var/tempo }
          readinessProbe:
            httpGet: { path: /ready, port: 3200 }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /ready, port: 3200 }
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { cpu: 1000m, memory: 1Gi }
      volumes:
        - name: config
          configMap: { name: tempo-config }
        - name: traces
          persistentVolumeClaim: { claimName: tempo-traces }
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: ms-cinema
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tempo
  ports:
    - { name: http, port: 3200, targetPort: 3200 }
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
