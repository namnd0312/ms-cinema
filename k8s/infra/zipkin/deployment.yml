apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
  namespace: ms-cinema
  labels:
    app.kubernetes.io/name: zipkin
    app.kubernetes.io/part-of: ms-cinema
    app.kubernetes.io/component: infrastructure
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zipkin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zipkin
        app.kubernetes.io/part-of: ms-cinema
    spec:
      containers:
        - name: zipkin
          image: openzipkin/zipkin:3.4
          ports:
            - containerPort: 9411
          env:
            - name: JAVA_OPTS
              value: "-Xms64m -Xmx192m"
          resources:
            limits: { memory: "256Mi", cpu: "200m" }
          readinessProbe:
            httpGet: { path: /health, port: 9411 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 9411 }
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: zipkin
  namespace: ms-cinema
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: zipkin
  ports:
    - port: 9411
      targetPort: 9411
