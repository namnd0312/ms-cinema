# ServiceAccount for Promtail to access K8s API
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: ms-cinema
  labels:
    app.kubernetes.io/name: promtail
    app.kubernetes.io/part-of: ms-cinema
    app.kubernetes.io/component: infrastructure
---
# ClusterRole: read pods and nodes for log discovery
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail-ms-cinema
  labels:
    app.kubernetes.io/name: promtail
    app.kubernetes.io/part-of: ms-cinema
rules:
  - apiGroups: [""]
    resources: ["nodes", "services", "endpoints", "pods"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail-ms-cinema
  labels:
    app.kubernetes.io/name: promtail
    app.kubernetes.io/part-of: ms-cinema
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: ms-cinema
roleRef:
  kind: ClusterRole
  name: promtail-ms-cinema
  apiGroup: rbac.authorization.k8s.io
---
# Promtail configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: ms-cinema
  labels:
    app.kubernetes.io/name: promtail
    app.kubernetes.io/part-of: ms-cinema
    app.kubernetes.io/component: infrastructure
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /run/promtail/positions.yaml

    clients:
      - url: http://loki:3100/loki/api/v1/push

    scrape_configs:
      - job_name: kubernetes-pods
        static_configs:
          - targets: [localhost]
            labels:
              job: ms-cinema
              __path__: /var/log/pods/ms-cinema_*/*/*.log
        pipeline_stages:
          - cri: {}
          - labeldrop:
              - filename
---
# Promtail DaemonSet
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: ms-cinema
  labels:
    app.kubernetes.io/name: promtail
    app.kubernetes.io/part-of: ms-cinema
    app.kubernetes.io/component: infrastructure
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: promtail
  template:
    metadata:
      labels:
        app.kubernetes.io/name: promtail
        app.kubernetes.io/part-of: ms-cinema
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/promtail:2.9.6
          args:
            - -config.file=/etc/promtail/promtail.yaml
          ports:
            - containerPort: 9080
          volumeMounts:
            - name: promtail-config
              mountPath: /etc/promtail
            - name: pods-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: docker-logs
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: positions
              mountPath: /run/promtail
          resources:
            requests: { memory: "64Mi", cpu: "50m" }
            limits: { memory: "128Mi", cpu: "100m" }
          readinessProbe:
            httpGet: { path: /ready, port: 9080 }
            initialDelaySeconds: 10
            periodSeconds: 10
      tolerations:
        - effect: NoSchedule
          operator: Exists
      volumes:
        - name: promtail-config
          configMap:
            name: promtail-config
        - name: pods-logs
          hostPath:
            path: /var/log/pods
        - name: docker-logs
          hostPath:
            path: /var/lib/docker/containers
        # emptyDir: positions lost on pod restart (causes log re-ingestion).
        # For persistent dev, switch to hostPath: /var/run/promtail
        - name: positions
          emptyDir: {}
