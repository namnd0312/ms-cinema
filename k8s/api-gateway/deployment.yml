apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ms-cinema
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: ms-cinema
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/part-of: ms-cinema
    spec:
      containers:
        - name: api-gateway
          image: ms-cinema/api-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: ms-cinema-config
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms64m -Xmx256m -Duser.timezone=Asia/Ho_Chi_Minh"
          resources:
            limits: { memory: "512Mi", cpu: "300m" }
          startupProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ms-cinema
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
