apiVersion: v1
kind: ConfigMap
metadata:
  name: ms-cinema-config
  namespace: ms-cinema
data:
  # Spring profile - disables Eureka routes, uses static URIs
  SPRING_PROFILES_ACTIVE: "k8s"
  # Disable Eureka and config-server
  EUREKA_CLIENT_ENABLED: "false"
  SPRING_CLOUD_CONFIG_ENABLED: "false"
  # Infrastructure hosts (in-cluster K8s DNS)
  DB_HOST: "postgresql"
  REDIS_HOST: "redis"
  # Override Redis properties explicitly to avoid K8s service env var clash
  # (K8s injects REDIS_PORT=tcp://<ip>:6379 which breaks ${REDIS_PORT:6379} int binding)
  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"
  KAFKA_HOST: "kafka"
  ZIPKIN_HOST: "zipkin"
  # --- Migrated from config-server config-repo ---
  # Kafka configuration
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET: "earliest"
  SPRING_KAFKA_CONSUMER_VALUE_DESERIALIZER: "org.springframework.kafka.support.serializer.JsonDeserializer"
  SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER: "org.springframework.kafka.support.serializer.JsonSerializer"
  SPRING_KAFKA_PROPERTIES_SPRING_JSON_TRUSTED_PACKAGES: "com.namnd.kafka.events.*"
  # Zipkin tracing
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: "http://zipkin:9411/api/v2/spans"
  # JWT alias (non-secret)
  NAMND_APP_JWTALIAS: "namnd-cinema"
  # Inter-service URLs (for FeignClient)
  MOVIE_SERVICE_URL: "http://movie-service:8082"
  # Exclude mail from health checks (credentials are environment-specific)
  MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
  # Java timezone
  TZ: "Asia/Ho_Chi_Minh"
  # Frontend URLs for auth redirects (password reset email link, OAuth2 callback)
  PASSWORD_RESET_BASE_URL: "http://192.168.139.2/auth/reset-password"
  OAUTH2_CALLBACK_URL: "http://192.168.139.2/auth/oauth2/callback"
  # JAVA_TOOL_OPTIONS set per-service in deployment.yml (includes timezone + heap)

