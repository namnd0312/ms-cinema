apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: ms-cinema
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/part-of: ms-cinema
    app.kubernetes.io/component: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-service
        app.kubernetes.io/part-of: ms-cinema
    spec:
      initContainers:
        - name: wait-for-postgresql
          image: busybox:1.36
          command: ['sh', '-c']
          args:
            - |
              until nc -z postgresql 5432; do
                echo "Waiting for postgresql..."
                sleep 3
              done
        - name: wait-for-kafka
          image: busybox:1.36
          command: ['sh', '-c']
          args:
            - |
              until nc -z kafka 9092; do
                echo "Waiting for kafka..."
                sleep 3
              done
        - name: wait-for-redis
          image: busybox:1.36
          command: ['sh', '-c']
          args:
            - |
              until nc -z redis 6379; do
                echo "Waiting for redis..."
                sleep 3
              done
      containers:
        - name: notification-service
          image: ms-cinema/notification-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8085
          envFrom:
            - configMapRef:
                name: ms-cinema-config
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms128m -Xmx384m -Duser.timezone=Asia/Ho_Chi_Minh"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef: { name: ms-cinema-secrets, key: DB_USERNAME }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: ms-cinema-secrets, key: DB_PASSWORD }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: ms-cinema-secrets, key: JWT_SECRET }
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef: { name: ms-cinema-secrets, key: MAIL_USERNAME }
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef: { name: ms-cinema-secrets, key: MAIL_PASSWORD }
          resources:
            limits: { memory: "768Mi", cpu: "500m" }
          startupProbe:
            httpGet: { path: /actuator/health, port: 8085 }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8085 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8085 }
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: ms-cinema
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: notification-service
  ports:
    - port: 8085
      targetPort: 8085
