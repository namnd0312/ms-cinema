apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ms-cinema-ingress
  namespace: ms-cinema
  labels:
    app.kubernetes.io/part-of: ms-cinema
    app.kubernetes.io/component: ingress
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    # WebSocket: keep connections alive for 24h
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
    # SSE: disable buffering for streaming responses
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # --- auth-service ---
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 8081
          - path: /api/users
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 8081
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 8081
          - path: /login/oauth2
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 8081

          # --- movie-service ---
          - path: /api/movies
            pathType: Prefix
            backend:
              service:
                name: movie-service
                port:
                  number: 8082
          - path: /api/showtimes
            pathType: Prefix
            backend:
              service:
                name: movie-service
                port:
                  number: 8082
          - path: /api/theaters
            pathType: Prefix
            backend:
              service:
                name: movie-service
                port:
                  number: 8082
          - path: /api/comments
            pathType: Prefix
            backend:
              service:
                name: movie-service
                port:
                  number: 8082

          # --- booking-service (HTTP + WebSocket) ---
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: booking-service
                port:
                  number: 8083
          - path: /api/bookings
            pathType: Prefix
            backend:
              service:
                name: booking-service
                port:
                  number: 8083

          # --- payment-service ---
          - path: /api/payments
            pathType: Prefix
            backend:
              service:
                name: payment-service
                port:
                  number: 8084

          # --- notification-service ---
          - path: /api/notifications
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 8085

          # --- audit-service ---
          - path: /api/audit
            pathType: Prefix
            backend:
              service:
                name: audit-service
                port:
                  number: 8086

          # --- frontend (default / catch-all) ---
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cinema-frontend
                port:
                  number: 80
