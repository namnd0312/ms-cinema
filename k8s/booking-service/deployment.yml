apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
  namespace: ms-cinema
  labels:
    app.kubernetes.io/name: booking-service
    app.kubernetes.io/part-of: ms-cinema
    app.kubernetes.io/component: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: booking-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: booking-service
        app.kubernetes.io/part-of: ms-cinema
    spec:
      initContainers:
        - name: wait-for-postgresql
          image: busybox:1.36
          command: ['sh', '-c']
          args:
            - |
              until nc -z postgresql 5432; do
                echo "Waiting for postgresql..."
                sleep 3
              done
        - name: wait-for-kafka
          image: busybox:1.36
          command: ['sh', '-c']
          args:
            - |
              until nc -z kafka 9092; do
                echo "Waiting for kafka..."
                sleep 3
              done
        - name: wait-for-redis
          image: busybox:1.36
          command: ['sh', '-c']
          args:
            - |
              until nc -z redis 6379; do
                echo "Waiting for redis..."
                sleep 3
              done
      containers:
        - name: booking-service
          image: ms-cinema/booking-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: ms-cinema-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef: { name: ms-cinema-secrets, key: DB_USERNAME }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: ms-cinema-secrets, key: DB_PASSWORD }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: ms-cinema-secrets, key: JWT_SECRET }
          resources:
            limits: { memory: "256Mi", cpu: "300m" }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8083 }
            initialDelaySeconds: 40
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8083 }
            initialDelaySeconds: 80
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: booking-service
  namespace: ms-cinema
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: booking-service
  ports:
    - port: 8083
      targetPort: 8083
