apiVersion: apps/v1
kind: Deployment
metadata:
  name: cinema-frontend
  namespace: ms-cinema
  labels:
    app.kubernetes.io/name: cinema-frontend
    app.kubernetes.io/part-of: ms-cinema
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cinema-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cinema-frontend
        app.kubernetes.io/part-of: ms-cinema
    spec:
      containers:
        - name: cinema-frontend
          image: ms-cinema/cinema-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          resources:
            limits: { memory: "64Mi", cpu: "50m" }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: cinema-frontend
  namespace: ms-cinema
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cinema-frontend
  ports:
    - port: 80
      targetPort: 80
