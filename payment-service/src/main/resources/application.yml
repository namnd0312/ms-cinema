server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: payment-service
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/paymentdb
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:9092
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: payment-service
    template:
      observation-enabled: true
    listener:
      observation-enabled: true

jwt:
  auth:
    secret: ${JWT_SECRET:kBJb8FEOvTCWEcfZB6RLMM5BLoI8p0FWOWEu7FSZBYn+ItVi7mHRePYCvum5Ic6l4M2nFw+kdl8du99Bxnb7zg==}
    # Phase 05 cutover: RS256 verification via JWKS; HS512 still accepted during grace.
    jwks-uri: ${JWT_JWKS_URI:http://auth-service:8081/oauth2/jwks}
    issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081}
    audience: ${JWT_AUDIENCE:ms-cinema-internal}
    dual-mode-enabled: ${JWT_DUAL_MODE_ENABLED:true}
    public-paths:
      - /api/payments/webhook
      - /api/payments/fake-success
      - /error
      - /actuator/health
      - /actuator/prometheus
      - /swagger-ui/**
      - /v3/api-docs/**
      - /swagger-ui.html

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

stripe:
  api-key: ${STRIPE_API_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

reconciliation:
  cron: "0 0 2 * * *"
  auto-run:
    enabled: true
  max-date-range-days: 31

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}  # Use 0.1 or lower in production
  otlp:
    tracing:
      endpoint: http://${OTEL_COLLECTOR_HOST:localhost}:4318/v1/traces
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      deployment.environment: ${DEPLOYMENT_ENV:dev}
