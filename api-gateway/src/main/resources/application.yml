server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: "optional:configserver:http://${CONFIG_SERVER_HOST:localhost}:8888"
  cloud:
    gateway:
      mvc:
        routes:
          - id: auth-service
            uri: lb://auth-service
            predicates:
              - Path=/api/auth/**
          - id: auth-service-users
            uri: lb://auth-service
            predicates:
              - Path=/api/users/**
          - id: auth-service-oauth2-authorization
            uri: lb://auth-service
            predicates:
              - Path=/oauth2/authorization/**
          - id: auth-service-oauth2-callback
            uri: lb://auth-service
            predicates:
              - Path=/login/oauth2/code/**
          - id: movie-service
            uri: lb://movie-service
            predicates:
              - Path=/api/movies/**
          - id: movie-service-showtimes
            uri: lb://movie-service
            predicates:
              - Path=/api/showtimes/**
          - id: movie-service-theaters
            uri: lb://movie-service
            predicates:
              - Path=/api/theaters/**
          - id: movie-service-comments
            uri: lb://movie-service
            predicates:
              - Path=/api/comments/**
          - id: booking-service-ws
            uri: lb://booking-service
            predicates:
              - Path=/ws/**
          - id: booking-service
            uri: lb://booking-service
            predicates:
              - Path=/api/bookings/**
          - id: payment-service
            uri: lb://payment-service
            predicates:
              - Path=/api/payments/**
          - id: notification-service
            uri: lb://notification-service
            predicates:
              - Path=/api/notifications/**
          - id: audit-service
            uri: lb://audit-service
            predicates:
              - Path=/api/audit/**

          # Swagger api-docs routes
          - id: auth-service-docs
            uri: lb://auth-service
            predicates:
              - Path=/auth-service/v3/api-docs/**
            filters:
              - StripPrefix=1
          - id: movie-service-docs
            uri: lb://movie-service
            predicates:
              - Path=/movie-service/v3/api-docs/**
            filters:
              - StripPrefix=1
          - id: booking-service-docs
            uri: lb://booking-service
            predicates:
              - Path=/booking-service/v3/api-docs/**
            filters:
              - StripPrefix=1
          - id: payment-service-docs
            uri: lb://payment-service
            predicates:
              - Path=/payment-service/v3/api-docs/**
            filters:
              - StripPrefix=1
          - id: notification-service-docs
            uri: lb://notification-service
            predicates:
              - Path=/notification-service/v3/api-docs/**
            filters:
              - StripPrefix=1
          - id: audit-service-docs
            uri: lb://audit-service
            predicates:
              - Path=/audit-service/v3/api-docs/**
            filters:
              - StripPrefix=1

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Auth Service
        url: /auth-service/v3/api-docs
      - name: Movie Service
        url: /movie-service/v3/api-docs
      - name: Booking Service
        url: /booking-service/v3/api-docs
      - name: Payment Service
        url: /payment-service/v3/api-docs
      - name: Notification Service
        url: /notification-service/v3/api-docs
      - name: Audit Service
        url: /audit-service/v3/api-docs

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}  # Use 0.1 or lower in production
  zipkin:
    tracing:
      endpoint: http://${ZIPKIN_HOST:localhost}:9411/api/v2/spans
