server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: auth-service
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  datasource:
    url: jdbc:postgresql://localhost:5432/testdb
    username: postgres
    password: postgres
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:1089359077505-9bplo54297vhkb3v7vdg321cfa57v0to.apps.googleusercontent.com}
            client-secret: ${GOOGLE_CLIENT_SECRET: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}
            scope: openid,profile,email
            redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost/login/oauth2/code/google}
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    template:
      observation-enabled: true
    listener:
      observation-enabled: true

namnd:
  app:
    jwtSecret: ${JWT_SECRET:kBJb8FEOvTCWEcfZB6RLMM5BLoI8p0FWOWEu7FSZBYn+ItVi7mHRePYCvum5Ic6l4M2nFw+kdl8du99Bxnb7zg==}
    jwtExpiration: 900000
    jwtRefreshExpiration: 604800000
    passwordResetBaseUrl: ${PASSWORD_RESET_BASE_URL:http://localhost:4200/auth/reset-password}
    activationBaseUrl: ${ACTIVATION_BASE_URL:http://localhost:4200/auth/setup-password}
    maxFailedAttempts: ${MAX_FAILED_ATTEMPTS:5}
    lockDurationMs: ${LOCK_DURATION_MS:900000}
    oauth2CallbackUrl: ${OAUTH2_CALLBACK_URL:http://localhost:4200/auth/oauth2/callback}
    # OIDC issuer URI advertised to partner relying parties (token `iss` claim, discovery doc).
    # Used in Phase 02+ (Spring AS); set here for env wiring consistency.
    oauth2IssuerUri: ${OAUTH2_ISSUER_URI:http://localhost:8081}
    # KEK password for AES-GCM encrypting RSA private keys at rest. PBKDF2-derived.
    # MUST be a strong random string in production (32+ chars). Rotate by re-encrypting all keys.
    signingKeyEncryptionPassword: ${SIGNING_KEY_ENCRYPTION_PASSWORD:dev-kek-change-me-in-production-min-32-chars}
    # OAuth2/OIDC token TTLs (Phase 02). Applied as defaults to new RegisteredClients.
    accessTokenTtlSeconds: ${ACCESS_TOKEN_TTL_SECONDS:900}
    idTokenTtlSeconds: ${ID_TOKEN_TTL_SECONDS:3600}
    refreshTokenTtlSeconds: ${REFRESH_TOKEN_TTL_SECONDS:1209600}
    # Phase 05 cutover: RS256 default; emergency rollback override = HS512.
    # Resource services accept BOTH algs via the dual-mode shared lib (Phase 01).
    tokenSigningAlgorithm: ${TOKEN_SIGNING_ALGORITHM:RS256}
    # Audience claim added to RS256-issued internal tokens. Resource services should validate against this.
    jwtAudience: ${JWT_AUDIENCE:ms-cinema-internal}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}  # Use 0.1 or lower in production
  otlp:
    tracing:
      endpoint: http://${OTEL_COLLECTOR_HOST:localhost}:4318/v1/traces
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      deployment.environment: ${DEPLOYMENT_ENV:dev}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# logging levels moved to logback-spring.xml (structured JSON via logstash-logback-encoder)
